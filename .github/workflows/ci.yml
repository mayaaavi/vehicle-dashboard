name: Vehicle Dashboard CI

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # Create image tag from first 7 characters of Git commit SHA
      - name: Generate Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
          -u "${{ github.actor }}" \
          --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
          -t ghcr.io/${{ github.repository_owner }}/vehicle-dashboard:${IMAGE_TAG} .

      - name: Push Docker Image
        run: |
          docker push \
          ghcr.io/${{ github.repository_owner }}/vehicle-dashboard:${IMAGE_TAG}

      # Update Helm with the new Docker image version
      - name: Update Helm Image Tag
        run: |
          sed -i "s/tag: .*/tag: \"${IMAGE_TAG}\"/" \
          helm/vehicle-dashboard/values.yaml

      # Commit the updated Helm values back into Git
      - name: Commit Helm Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/vehicle-dashboard/values.yaml

          git commit -m "Update image tag to ${IMAGE_TAG}"

          git push