<!DOCTYPE html>
<html>
<head>
<title>Horizon Vehicle Dashboard</title>

<style>

body{
font-family:Arial;
padding:20px;
background:#f4f4f4;
}

.card{
padding:20px;
background:white;
margin:10px;
border-radius:10px;
}

</style>

</head>

<body>

<h1>Vehicle Health Dashboard</h1>

<div class="card">
Vehicle ID : {{data.vehicle_id}}
</div>

<div class="card">
Speed : {{data.speed}} km/h
</div>

<div class="card">
Battery : {{data.battery}} %
</div>

<div class="card">
Temperature : {{data.temperature}} °C
</div>

<div class="card">
OTA Version : {{data.ota_version}}
</div>

<div class="card">
Status : {{data.status}}
</div>

</body>
</html>
